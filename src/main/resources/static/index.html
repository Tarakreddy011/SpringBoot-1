<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .section {
            margin-bottom: 30px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management</h1>

    <!-- ADD STUDENT -->
    <div class="section">

        <h2>Add Student</h2>

        <input type="number" id="id" placeholder="Student ID">

        <input type="text" id="name" placeholder="Student Name">

        <input type="number" id="age" placeholder="Student Age">

        <input type="text" id="department" placeholder="Department">

        <button onclick="addStudent()">Add Student</button>

    </div>


    <!-- GET STUDENT -->
    <div class="section">

        <h2>Get Student</h2>

        <input type="number" id="searchId" placeholder="Enter Student ID">

        <button onclick="getStudent()">Get Student</button>

    </div>


    <!-- RESULT -->
    <div id="result">
        Result will appear here
    </div>

</div>


<script>

    // ADD STUDENT
    async function addStudent() {

        const student = {
            id: parseInt(document.getElementById("id").value),
            name: document.getElementById("name").value,
            age: parseInt(document.getElementById("age").value),
            depertment: document.getElementById("department").value
        };

        try {

            const response = await fetch("/addstudent", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(student)
            });

            const data = await response.text();

            document.getElementById("result").innerText = data;

        } catch (error) {

            document.getElementById("result").innerText =
                "Error: " + error;

        }
    }


    // GET STUDENT
    async function getStudent() {

        const id = document.getElementById("searchId").value;

        try {

            const response = await fetch("/getstudent/" + id);

            if (!response.ok) {
                document.getElementById("result").innerText =
                    "Student not found";
                return;
            }

            const student = await response.json();

            document.getElementById("result").innerText =
                "ID: " + student.id +
                "\nName: " + student.name +
                "\nAge: " + student.age +
                "\nDepartment: " + student.depertment;

        } catch (error) {

            document.getElementById("result").innerText =
                "Error: " + error;

        }
    }

</script>

</body>
</html>
